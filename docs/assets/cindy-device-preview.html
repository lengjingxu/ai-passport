<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cindy 设备界面预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf0e9;color:#17202a;font:15px system-ui;padding:24px 16px;text-align:center}h1{font-size:24px}p{max-width:440px;margin:16px auto;line-height:1.6}.screen{position:relative;width:240px;height:320px;background:#1689e8;margin:24px auto;text-align:left;overflow:hidden;font:14px Arial,sans-serif;box-shadow:0 0 0 10px #17202a,0 16px 0 10px #bdc8c3}.plate{position:absolute;left:5px;top:8px;width:151px;height:33px;background:#f4f4ea;border:3px solid #17202a;text-align:center;font-size:20px;font-weight:bold;box-shadow:4px 4px #17202a}.cloud{position:absolute;left:193px;top:12px;width:35px;height:10px;background:white;box-shadow:0 3px #17202a}.battery{position:absolute;right:8px;top:25px}.status{position:absolute;left:8px;top:46px;width:224px;height:36px;overflow:hidden}.grass{position:absolute;top:286px;height:34px;width:240px;background:#82be2d;border-top:4px solid #a7d93e}.box{position:absolute;top:88px;width:240px;height:194px;overflow:auto;scrollbar-width:none}.card{position:relative;margin:6px 12px 8px;width:216px;height:80px;border:4px solid #17202a;background:#f4f4ea;padding:7px;box-shadow:5px 6px #17202a}.selected{background:#ffd928;border-color:white}.title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:17px}.state{margin-top:3px;line-height:17px}.message{margin-top:3px;color:#3a4a5a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail,.record{height:182px}.detail .state{margin-top:6px}.detail .message{margin-top:8px;height:108px;white-space:normal;overflow:auto;line-height:18px}.source,.nav{position:absolute;left:8px;font-size:14px}.source{top:282px}.nav{top:299px}.record{text-align:center}.record .title{text-align:left}.voice{color:#e43b2f;margin-top:8px}.timer{font-size:20px;margin-top:10px}.meter{height:14px;background:#d9e7ec;margin-top:16px}.meter span{display:block;height:100%;width:48%;background:#82be2d}.hint{margin-top:24px;color:#0872c9}button{font:inherit;border:2px solid #17202a;border-radius:8px;padding:10px 16px;background:#f4f4ea;margin:4px;cursor:pointer}button:active{background:#ffd928}.note{font-size:13px;color:#50605a}
</style><h1>Cindy · 随身任务面板</h1><p>保留天空、草地和像素卡片。标题、状态、消息分行显示，录音时始终看见当前任务。</p><div class="screen"><div class="grass"></div><div class="plate">CINDY</div><div class="cloud"></div><div class="battery">82%</div><div class="status" id="status"></div><div class="box" id="box"></div><div class="source">Source: bridge file</div><div class="nav" id="nav"></div></div><div><button onclick="move(-1)">UP</button><button onclick="ok()">OK</button><button onclick="move(1)">DOWN</button></div><div><button onclick="reset()">重看列表</button><button onclick="timeout()">预览超时</button></div><p id="help"></p><p class="note">交互原型，使用虚构任务与模拟音量；不是设备截图。设备仍读取 bridge 文件，尚未接入 Cindy 实时任务。录音仅上传至 bridge。原型字体与实体屏幕会有差异。</p><script>
const tasks=[['Review interface','running','#0872c9','Separate task title, status and message. Keep the current task visible while recording.'],['Build device firmware','done','#55951d','Build completed. Device validation is still required.'],['Check voice upload','failed','#e43b2f','Upload timed out. Inspect the recording log before retrying.']];let selected=0,view='list',seconds=0,timer,result='';
function render(){let t=tasks[selected];document.getElementById('status').innerText=result||'Bridge connected | 3 tasks';document.getElementById('nav').innerText=view==='list'?'U/D: select   OK: open':view==='detail'?'U/D: task   OK: record':'Hold OK: cancel & exit';document.getElementById('help').innerText=view==='record'?'按 OK 模拟停止并上传。实体设备长按 OK 会取消并退出。':'UP / DOWN 切换任务，OK 进入详情，再按一次开始录音。';let box=document.getElementById('box');box.innerHTML=view==='list'?tasks.map((t,i)=>`<div class="card ${i===selected?'selected':''}"><div class="title">${t[0]}</div><div class="state" style="color:${t[2]}">${t[1]}</div><div class="message">${t[3]}</div></div>`).join(''):view==='detail'?`<div class="card detail"><div class="title">${t[0]}</div><div class="state" style="color:${t[2]}">${t[1]}</div><div class="message">${t[3]}</div></div>`:`<div class="card record"><div class="title">${t[0]}</div><div class="voice">VOICE FEEDBACK</div><div class="timer">${seconds}s / 30s</div><div class="meter"><span></span></div><div class="hint">OK: stop and send</div></div>`;if(view==='list')box.querySelector('.selected').scrollIntoView({block:'nearest'});}
function move(d){if(view==='record')return;selected=(selected+d+tasks.length)%tasks.length;result='';render()}
function ok(){result='';if(view==='list')view='detail';else if(view==='detail'){view='record';seconds=0;timer=setInterval(()=>{seconds++;if(seconds>=30)ok();else render()},1000)}else{clearInterval(timer);view='detail';result='Recording submitted (demo)'}render()}
function reset(){clearInterval(timer);view='list';result='';render()}
function timeout(){clearInterval(timer);view='detail';result='ESP_ERR_TIMEOUT\n18944B / 120ms (demo)';render()}render();
</script></html>
