<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cindy 设备界面预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf0e9;color:#17202a;font:15px system-ui;padding:24px 16px;text-align:center}h1{font-size:24px}p{max-width:440px;margin:16px auto;line-height:1.6}.screen{position:relative;width:240px;height:320px;background:#1689e8;margin:24px auto;text-align:left;overflow:hidden;font:14px Arial,sans-serif;box-shadow:0 0 0 10px #17202a,0 16px 0 10px #bdc8c3}.plate{position:absolute;left:5px;top:8px;width:151px;height:33px;background:#f4f4ea;border:3px solid #17202a;text-align:center;font-size:20px;font-weight:bold;box-shadow:4px 4px #17202a}.cloud{position:absolute;left:193px;top:12px;width:35px;height:10px;background:white;box-shadow:0 3px #17202a}.battery{position:absolute;right:8px;top:25px}.status{position:absolute;left:8px;top:46px;width:224px;height:36px;overflow:hidden}.grass{position:absolute;top:286px;height:34px;width:240px;background:#82be2d;border-top:4px solid #a7d93e}.box{position:absolute;top:88px;width:240px;height:194px;overflow:auto;scrollbar-width:none}.card{position:relative;margin:6px 12px 8px;width:216px;height:80px;border:4px solid #17202a;background:#f4f4ea;padding:7px;box-shadow:5px 6px #17202a}.selected{background:#ffd928;border-color:white}.title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:17px}.state{margin-top:3px;line-height:17px}.message{margin-top:3px;color:#3a4a5a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail,.record{height:182px}.detail .state{margin-top:6px}.detail .message{margin-top:8px;height:108px;white-space:normal;overflow:auto;line-height:18px}.source,.nav{position:absolute;left:8px;font-size:14px}.source{top:282px}.nav{top:299px}.record{text-align:center}.record .title{text-align:left}.voice{color:#e43b2f;margin-top:8px}.timer{font-size:20px;margin-top:10px}.meter{height:14px;background:#d9e7ec;margin-top:16px}.meter span{display:block;height:100%;width:48%;background:#82be2d}.hint{margin-top:24px;color:#0872c9}button{font:inherit;border:2px solid #17202a;border-radius:8px;padding:10px 16px;background:#f4f4ea;margin:4px;cursor:pointer}button:active{background:#ffd928}.note{font-size:13px;color:#50605a}
/* Match the device's 27px CJK line box and bounded task rows. */
.card{height:138px;padding:7px}.title{line-height:27px;height:54px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.state{line-height:27px;height:27px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.message{line-height:27px;height:27px;margin-top:2px}.detail,.record{height:182px}.detail .title,.record .title{height:27px;white-space:nowrap;display:block;text-overflow:ellipsis}.detail .state{margin-top:2px}.detail .message{margin-top:2px;height:102px;line-height:25px}.record .voice{margin-top:2px;line-height:27px}
.card:not(.detail):not(.record){height:80px}.list-first,.list-second{position:absolute;left:7px;top:7px;line-height:27px;height:27px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list-first{width:194px}.list-second{top:36px}.list-state{position:absolute;right:7px;top:36px;line-height:27px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style><h1>Cindy · 随身任务面板</h1><p>保留天空、草地和像素卡片。标题、状态、消息分行显示，录音时始终看见当前任务。</p><div class="screen"><div class="grass"></div><div class="plate">CINDY</div><div class="cloud"></div><div class="battery">82%</div><div class="status" id="status"></div><div class="box" id="box"></div><div class="source">你的桌面 AI 伙伴</div><div class="nav" id="nav"></div></div><div><button onclick="move(-1)">UP</button><button onclick="ok()">OK</button><button onclick="move(1)">DOWN</button></div><div><button onclick="reset()">长按 OK · 返回首页</button><button onclick="empty(false)">未连接</button><button onclick="empty(true)">已连接无任务</button></div><p id="help"></p><p class="note">交互原型，使用虚构任务与模拟音量；不是设备截图。固件开机直接进入 Cindy，通过蓝牙同步任务；录音转写后须在设备确认发送。原型字体与实体屏幕会有差异。</p><script>
const tasks=[['优化 Cindy 任务名称换行时的状态文案布局','running','#0872c9','Separate task title, status and message. Keep the current task visible while recording.'],['Build device firmware','done','#55951d','Build completed. Device validation is still required.'],['Check voice upload','failed','#e43b2f','Upload timed out. Inspect the recording log before retrying.']];let selected=0,view='list',seconds=0,timer,result='';
function listCard(t,i){const c=document.createElement('canvas').getContext('2d');c.font='14px Arial';const chars=Array.from(t[0]);let first='';while(chars.length&&c.measureText(first+chars[0]).width<=194)first+=chars.shift();const status={running:'进行中',done:'已完成',failed:'失败'}[t[1]]||t[1];const w=Math.max(56,Math.min(112,c.measureText(status).width));return `<div class="card ${i===selected?'selected':''}"><div class="list-first">${first}</div><div class="list-second" style="width:${194-w-8}px">${chars.join('')}</div><div class="list-state" style="width:${w}px;color:${t[2]}">${status}</div></div>`;}
function render(){let t=tasks[selected];document.getElementById('status').innerText=result||'Cindy 已连接';document.getElementById('nav').innerText=view==='list'?'上下选择  确认进入':view==='review'?'上重录 下阅读 确认发送':view==='detail'?'上下阅读  确认录音':'长按确认取消并返回';document.getElementById('help').innerText=view==='record'?'按 OK 模拟停止并转写，再次确认才发送。长按 OK 返回首页。':'UP / DOWN 切换任务，OK 进入详情，再按一次开始录音。';let box=document.getElementById('box');box.innerHTML=view==='list'?tasks.map((t,i)=>listCard(t,i)).join(''):(view==='detail'||view==='review')?`<div class="card detail"><div class="title">${t[0]}</div><div class="state" style="color:${t[2]}">${t[1]}</div><div class="message">${view==='review'?'请帮我检查这个任务的结果。（模拟转写）':t[3]}</div></div>`:`<div class="card record"><div class="title">${t[0]}</div><div class="voice">语音回复</div><div class="timer">${seconds}s / 30s</div><div class="meter"><span></span></div><div class="hint">确认停止并转写</div></div>`;if(view==='list')box.querySelector('.selected').scrollIntoView({block:'nearest'});}
function move(d){if(view==='record')return;if(view==='review'){if(d<0){view='detail';ok()}return;}if(view==='detail'){result='回复翻页（模拟）';render();return;}selected=(selected+d+tasks.length)%tasks.length;result='';render()}
function ok(){result='';if(view==='list')view='detail';else if(view==='review'){view='detail';result='已确认发送到原任务'}else if(view==='detail'){view='record';seconds=0;timer=setInterval(()=>{seconds++;if(seconds>=30)ok();else render()},1000)}else{clearInterval(timer);view='review';result='请确认转写（模拟）'}render()}
function reset(){clearInterval(timer);view='list';result='';render()}
function empty(connected){clearInterval(timer);view='list';document.getElementById('status').innerText=connected?'Cindy 已连接':'等待连接 Cindy';document.getElementById('nav').innerText='等待 Cindy 同步任务';document.getElementById('box').innerHTML=`<div class="card detail" style="text-align:center;padding-top:70px">${connected?'已连接 Cindy<br>新任务会自动出现在这里':'连接电脑端 Cindy<br>设置 > 快捷键 > 配件<br>启用 Cindy Passport'}</div>`;document.getElementById('help').innerText='开机直接进入此首页；连接后任务自动同步。'}render();
</script></html>
